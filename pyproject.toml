[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-screener"
version = "0.1.0"
description = "Trader-style S&P 500 stock screener (Streamlit + Yahoo Finance) with setup detection, trade planning, ranking, portfolio construction, and backtesting."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Alan Gu" }]
keywords = ["stocks", "screener", "trading", "streamlit", "finance", "backtesting"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "numpy>=1.26.0,<3.0",
    "pandas>=2.2.0,<4.0",
    "plotly>=5.22.0,<7.0",
    "streamlit>=1.36.0,<2.0",
    "yfinance>=0.2.40,<2.0",
    "requests>=2.32.0,<3.0",
    "lxml>=6.0.0,<7.0",
]

[project.urls]
Homepage = "https://github.com/alangu88/stock-screener"
Repository = "https://github.com/alangu88/stock-screener"

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0,<10.0",
    "pytest-cov>=5.0.0,<7.0",
    "ruff>=0.6.0,<1.0",
    "mypy>=1.11.0,<2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
# Line length is owned by the formatter (ruff format), not the linter, so E501
# is not enforced as a lint error -- the standard ruff pairing.
ignore = ["E501"]

[tool.ruff.format]
# Match the codebase's established single-quote style.
quote-style = "single"

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
# Gradual-typing baseline: structural checks (undefined names, bad attributes,
# import errors, wrong call signatures) are enforced. pandas exposes Series /
# DataFrame.get() values as a broad ``Any | None``, which would otherwise flood
# every guarded float() coercion and arithmetic op with false positives, so
# those value-level codes are tolerated until the data layer grows stricter types.
disable_error_code = ["arg-type", "operator", "assignment", "index", "union-attr", "misc"]

# numpy ships PEP 695 stubs that mypy cannot parse under python_version 3.11; skip
# following them (runtime behaviour is unaffected -- this is static analysis only).
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

